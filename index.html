    <link rel="canonical" href="https://metisprimeproduction.com/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo-main.PNG" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//metisprimeproduction.com" />
    <link rel="dns-prefetch" href="//images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Metis Prime Production",
      "url": "https://metisprimeproduction.com",
      "logo": "https://metisprimeproduction.com/logo-main.PNG",
      "description": "Metis Prime Production delivers exceptional digital solutions including visual production, branding, web development, and cinematic videography.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "UAE",
        "addressLocality": "Dubai"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+971507304941",
        "contactType": "customer service",
        "email": "metisprimeproduction@gmail.com"
      },
      "sameAs": [
        "https://www.instagram.com/metisprimeproduction",
        "https://www.facebook.com/metisprimeproduction",
        "https://www.linkedin.com/company/metisprimeproduction"
      ],
      "services": [
        "Visual Production",
        "Digital Strategy",
        "Website Development",
        "Branding",
        "Identity Design",
        "Innovation Solutions",
        "Cinematic Videography"
      ]
    }
    </script>
    
    <!-- Scroll to Top Button -->
    <button id="scrollToTopBtn" aria-label="Scroll to top" style="display: none; position: fixed; bottom: 30px; right: 30px; z-index: 9999; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); width: 50px; height: 50px; border-radius: 50%; color: #D3FD50; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); outline: none; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.3s;">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
    <script>
      const scrollToTopBtn = document.getElementById("scrollToTopBtn");
      
      window.addEventListener("scroll", () => {
        if (window.pageYOffset > 400) {
          scrollToTopBtn.style.display = "flex";
          scrollToTopBtn.style.opacity = "1";
        } else {
          scrollToTopBtn.style.display = "none";
          scrollToTopBtn.style.opacity = "0";
        }
      });
      
      scrollToTopBtn.addEventListener("click", () => {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });
      
      scrollToTopBtn.addEventListener("mouseover", () => {
        scrollToTopBtn.style.background = "#D3FD50";
        scrollToTopBtn.style.color = "#000";
        scrollToTopBtn.style.transform = "translateY(-5px) scale(1.05)";
        scrollToTopBtn.style.boxShadow = "0 15px 35px rgba(211, 253, 80, 0.2)";
      });
      
      scrollToTopBtn.addEventListener("mouseout", () => {
        scrollToTopBtn.style.background = "rgba(10, 10, 10, 0.8)";
        scrollToTopBtn.style.color = "#D3FD50";
        scrollToTopBtn.style.transform = "translateY(0) scale(1)";
        scrollToTopBtn.style.boxShadow = "0 10px 30px rgba(0,0,0,0.5)";
      });
    </script>
  </body>
</html>

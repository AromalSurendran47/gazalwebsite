[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

# Exclude video files from SPA redirect
[[redirects]]
from = "/bg.mp4"
to = "/bg.mp4"
status = 200

[[redirects]]
from = "/phone bg.mp4"
to = "/phone bg.mp4"
status = 200

[[redirects]]
from = "/video.mp4"
to = "/video.mp4"
status = 200

# Add headers for proper video streaming
[[headers]]
for = "/*.mp4"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "video/mp4"
Accept-Ranges = "bytes"